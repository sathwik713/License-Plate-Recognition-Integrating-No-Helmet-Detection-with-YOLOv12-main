<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helmet Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-custom { border-radius: 25px; padding: 10px 30px; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-shield-alt"></i> Helmet Detection</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="{% url 'home' %}">Home</a>
                <a class="nav-link" href="{% url 'upload' %}">Upload Video</a>
                <a class="nav-link" href="{% url 'live' %}">Live Camera</a>
                <a class="nav-link" href="{% url 'report' %}">Reports</a>
                <a class="nav-link" href="{% url 'training' %}">Training</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-5 text-center">
                    <h1 class="mb-4"><i class="fas fa-motorcycle"></i> Helmet & License Plate Detection System</h1>
                    <p class="lead mb-4">AI-powered detection of helmets, no-helmets, and license plates with OCR text extraction.</p>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <a href="{% url 'upload' %}" class="btn btn-primary btn-custom w-100">
                                <i class="fas fa-upload"></i> Upload Video
                            </a>
                        </div>
                        <div class="col-md-4 mb-3">
                            <a href="{% url 'live' %}" class="btn btn-success btn-custom w-100">
                                <i class="fas fa-camera"></i> Live Camera
                            </a>
                        </div>
                        <div class="col-md-4 mb-3">
                            <a href="{% url 'report' %}" class="btn btn-info btn-custom w-100">
                                <i class="fas fa-chart-bar"></i> View Reports
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
