<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-shield-alt"></i> Helmet Detection</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'home' %}">Home</a>
                <a class="nav-link" href="{% url 'upload' %}">Upload Video</a>
                <a class="nav-link" href="{% url 'live' %}">Live Camera</a>
                <a class="nav-link" href="{% url 'report' %}">Reports</a>
                <a class="nav-link active" href="{% url 'training' %}">Training</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="card p-4">
                    <h2 class="mb-4"><i class="fas fa-chart-line"></i> Training Results</h2>
                    <div class="row mt-4">
                        <div class="col-md-12">
                            <h4>Model Performance Data</h4>
                            <div class="table-responsive">
                                {{ data|safe }}
                            </div>
                        </div>
                </div>
                    <div class="row">
                        <div class="col-md-6">
                            <h4>Confusion Matrix (Normalized)</h4>
                            <img src="/static/images/confusion_matrix_normalized.png" alt="Normalized Confusion Matrix" class="img-fluid">
                        </div>
                        <div class="col-md-6">
                            <h4>Confusion Matrix</h4>
                            <img src="/static/images/confusion_matrix.png" alt="Confusion Matrix" class="img-fluid">
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col-md-6">
                            <h4>Results Plot</h4>
                            <img src="/static/images/results.png" alt="Results Plot" class="img-fluid">
                        </div>
                        <div class="col-md-6">
                            <h4>Number Plate Verification</h4>
                            <img src="/static/images/Number Plate Verification Yolov12.png" alt="Number Plate Verification" class="img-fluid">
                        </div>
                    </div>
                    
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
